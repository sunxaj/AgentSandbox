# Settings for the separate document RAG collection.

[paths]
# Original source documents; this folder is separate from the Obsidian vault.
document_source = ~/Documents/qdrant
# Generated table metadata is kept separate from the general document corpus.
metadata_source = /home/xs/Documents/data/metadata

[document_rag]
# Initial supported formats for document ingestion.
supported_extensions = .md, .txt, .pdf, .csv, .json, .yaml, .yml, .html
collection = documents
metadata_collection = metadata


[servers]
# Qdrant runs on the Linux server alongside the MCP server and workers.
qdrant_url = http://192.168.0.222:6333
# Leave blank when Qdrant authentication is not configured.
qdrant_api_key =

[chunking]
# Keep chunks below the current embedding server's 512-token per-input limit.
max_chars = 500
overlap_chars = 100
embedding_batch_size = 8
