[http]
# MCP listener bound to the LAN interface so the Linux server can reach it directly.
host = 192.168.0.222
port = 8000
path = /mcp

# Host-header allowlist used by the MCP SDK's DNS-rebinding protection.
# Bound to the LAN interface; only LAN Host headers are expected.
allowed_hosts = 192.168.0.222:8000

# Allowed browser origins. Bonsai llama-server can proxy MCP requests when
# direct browser CORS access is not available.
allowed_origins = http://127.0.0.1:8000,http://localhost:8000,http://localhost:8080,http://localhost:9090,http://192.168.0.222:8080,http://192.168.0.222:8081,http://192.168.0.222:9090
