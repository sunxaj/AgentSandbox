[paths]
# Relative paths resolve from the repository root; ~ is expanded.
conversation_exports = conversation_exports
import_output = obsidian-import
vault = ~/Documents/vault/obsidian/AI_Conversations
semantic_index = 30 Index/semantic_index.json

[vault_folders]
# Imported transcript mirrors are copied under this folder.
inbox = 00 Inbox
knowledge = 10 Knowledge
topics = 20 Topics

[servers]
bonsai_base_url = http://192.168.0.222:8081/v1
embeddings_url = http://192.168.0.222:8082/v1/embeddings
